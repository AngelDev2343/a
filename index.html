<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Racha</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%23f6f6f4'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23111'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%23f6f6f4'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f6f4;
    --fg: #111111;
    --muted: #8a8a86;
    --line: #d9d9d5;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --fg: #f2f2ef; --muted: #77776f; --line: #2c2c2a; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3rem;
    padding: env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .count {
    text-align: center;
  }
  #n {
    display: block;
    font-size: clamp(7rem, 38vw, 14rem);
    font-weight: 200;
    line-height: 1;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }
  #n.pop { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.94); opacity: .6; } to { transform: none; opacity: 1; } }
  #label {
    display: block;
    margin-top: .5rem;
    font-size: 1rem;
    color: var(--muted);
  }
  .buttons { display: flex; gap: 1.25rem; }
  button {
    width: 5.5rem;
    height: 5.5rem;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 2.25rem;
    font-weight: 300;
    line-height: 1;
    cursor: pointer;
    transition: transform .1s, background .15s;
  }
  button:active { transform: scale(.94); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  #plus { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  button:disabled { opacity: .3; cursor: default; }
  #reset {
    width: auto;
    height: auto;
    border: 0;
    border-radius: 0;
    padding: .5rem 1rem;
    font-size: .95rem;
    font-weight: 400;
    color: var(--muted);
  }
  #reset.confirm { color: var(--fg); text-decoration: underline; text-underline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) {
    #n.pop { animation: none; }
    button { transition: none; }
  }
</style>
</head>
<body>
  <main class="count" aria-live="polite">
    <span id="n">0</span>
    <span id="label">días</span>
  </main>
  <div class="buttons">
    <button id="minus" aria-label="Restar un día">−</button>
    <button id="plus" aria-label="Sumar un día">+</button>
  </div>
  <button id="reset">Restablecer</button>

<script>
(() => {
  const KEY = 'racha:dias';
  const n = document.getElementById('n');
  const label = document.getElementById('label');
  const minus = document.getElementById('minus');
  const plus = document.getElementById('plus');
  const reset = document.getElementById('reset');

  let value = 0;
  try { value = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) {}

  function render(animate) {
    n.textContent = value;
    label.textContent = value === 1 ? 'día' : 'días';
    minus.disabled = value <= 0;
    reset.disabled = value <= 0;
    document.title = value + (value === 1 ? ' día' : ' días');
    if (animate) {
      n.classList.remove('pop');
      void n.offsetWidth;
      n.classList.add('pop');
    }
  }

  function change(delta) {
    const next = Math.max(0, value + delta);
    if (next === value) return;
    value = next;
    try { localStorage.setItem(KEY, value); } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(10);
    render(true);
  }

  plus.addEventListener('click', () => change(1));
  minus.addEventListener('click', () => change(-1));

  // Restablecer: pide un segundo toque para confirmar
  let resetTimer;
  function cancelReset() {
    clearTimeout(resetTimer);
    reset.classList.remove('confirm');
    reset.textContent = 'Restablecer';
  }
  reset.addEventListener('click', () => {
    if (!reset.classList.contains('confirm')) {
      reset.classList.add('confirm');
      reset.textContent = 'Toca otra vez para confirmar';
      resetTimer = setTimeout(cancelReset, 3000);
      return;
    }
    cancelReset();
    value = 0;
    try { localStorage.setItem(KEY, value); } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(20);
    render(true);
  });

  // Evita el zoom por pellizco en iOS
  document.addEventListener('gesturestart', e => e.preventDefault());

  render(false);

  // Manifest generado desde el propio HTML
  const base = new URL('./', location.href).href;
  const icon = "data:image/svg+xml," + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#111'/><circle cx='50' cy='50' r='16' fill='#f6f6f4'/></svg>"
  );
  const manifest = {
    name: 'Racha',
    short_name: 'Racha',
    start_url: base,
    scope: base,
    display: 'standalone',
    background_color: '#f6f6f4',
    theme_color: '#111111',
    icons: [
      { src: icon, sizes: 'any', type: 'image/svg+xml', purpose: 'any' },
      { src: icon, sizes: 'any', type: 'image/svg+xml', purpose: 'maskable' }
    ]
  };
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
  document.head.appendChild(link);

  // Service worker (funciona sin conexión)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
